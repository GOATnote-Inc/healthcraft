name: Whitepaper

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "docs/whitepaper/**"
      - "scripts/generate_paper_figures.py"
      - "scripts/verify_canonical_numbers.py"
      - "scripts/build_arxiv_submission.py"
      - "src/healthcraft/trajectory.py"
      - "pyproject.toml"
      - "constraints-security.txt"
      - "results/pilot-v*/**"
      - ".github/workflows/whitepaper.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/whitepaper/**"
      - "scripts/generate_paper_figures.py"
      - "scripts/verify_canonical_numbers.py"
      - "scripts/build_arxiv_submission.py"
      - "src/healthcraft/trajectory.py"
      - "pyproject.toml"
      - "constraints-security.txt"
      - "results/pilot-v*/**"
      - ".github/workflows/whitepaper.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python deps for figure generation
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-security.txt -e . matplotlib

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-science \
            texlive-pictures \
            poppler-utils

      # Historical pilot aggregates are not all distributed in Git. Compile
      # the reviewed, tracked figure snapshots; regenerating with missing
      # inputs would silently replace them with empty charts.
      - name: Verify frozen figure snapshots
        working-directory: docs/whitepaper
        run: shasum -a 256 -c figures/SHA256SUMS

      - name: Verify canonical numbers
        run: python scripts/verify_canonical_numbers.py

      - name: Build whitepaper (named + anonymous)
        working-directory: docs/whitepaper
        run: make ci

      - name: Build and compile arXiv source archive
        run: |
          python scripts/build_arxiv_submission.py --output-dir docs/whitepaper/output/arxiv
          mkdir -p "$RUNNER_TEMP/healthcraft-arxiv"
          tar -xzf docs/whitepaper/output/arxiv/healthcraft-arxiv-source.tar.gz -C "$RUNNER_TEMP/healthcraft-arxiv"
          cd "$RUNNER_TEMP/healthcraft-arxiv"
          pdflatex -interaction=nonstopmode -halt-on-error -no-shell-escape ms.tex
          bibtex ms
          pdflatex -interaction=nonstopmode -halt-on-error -no-shell-escape ms.tex
          pdflatex -interaction=nonstopmode -halt-on-error -no-shell-escape ms.tex
          if grep -E 'undefined|multiply defined' ms.log; then
            echo "Unresolved arXiv references"
            exit 1
          fi

      - name: Upload arXiv sources and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whitepaper-arxiv-source
          path: docs/whitepaper/output/arxiv/*
          if-no-files-found: error

      - name: Upload named PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whitepaper-named
          path: docs/whitepaper/output/whitepaper_named.pdf
          if-no-files-found: error

      - name: Upload anonymous PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whitepaper-anonymous
          path: docs/whitepaper/output/whitepaper_anonymous.pdf
          if-no-files-found: error
