    critical: true

metadata:
  openem_condition: "subarachnoid_hemorrhage"
  expected_tool_calls: "6-9"
  entity_types: 5
  time_pressure: "moderate"
  cognitive_load: "high"
  teaching_point: "Clinical decision rules must be applied correctly before they can be trusted. The Ottawa SAH Rule counts age >=40 and thunderclap onset as criteria; this patient scores 2/6 and is rule-POSITIVE, mandating CT head then LP or CTA. Misreading a positive rule as a negative one is the dangerous error. Document the reasoning; an elevated pretest probability (family history of aneurysmal SAH) reinforces the imaging decision."
